; OPcache para el servidor de desarrollo (php artisan serve corre en modo CLI).
; Sin esto, cada petición vuelve a leer y compilar cientos de archivos PHP desde
; la carpeta montada de Windows y cada página tarda varios segundos.
opcache.enable_cli=1
; Revisa cambios en cada petición: lo que se edite en el código se ve al instante.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
